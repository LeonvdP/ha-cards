<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Awning card preview</title>
<style>
body{margin:0;padding:24px;background:#111318;font-family:Roboto,system-ui,sans-serif;color:var(--primary-text-color);
--primary-text-color:#e6e6e6;--secondary-text-color:#9aa0a6;--disabled-text-color:#6f757c;--card-background-color:#1c1f26}
body.light{background:#f2f3f5;--primary-text-color:#1c1c1c;--secondary-text-color:#6b6f75;--card-background-color:#fff}
h1{font-size:18px;margin:0 0 4px} p{margin:0 0 14px;color:var(--secondary-text-color);font-size:13px;max-width:860px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,400px),1fr));gap:16px;max-width:860px;align-items:start}
ha-card{display:block;background:var(--card-background-color);border-radius:12px;border:1px solid #2a2e36}
body.light ha-card{border-color:#e3e5e8}
.bar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap} .bar button,.bar select{font:inherit;font-size:13px;padding:6px 12px;border-radius:8px;border:1px solid #444a;background:transparent;color:inherit;cursor:pointer}
.bar option{color:#000}
</style>
<script src="icons.js"></script>
<script src="_stubs.js"></script>
<script>try { localStorage.clear(); } catch (e) {} // start every preview with a closed awning</script>
<script src="../cards/awning-card.js"></script>
</head><body>
<h1>Awning card — live preview</h1>
<p>Simulated awning with your three scripts and an open/closed Zigbee sensor. Travel time is set to 10 s here so you can watch a full run — press Open, Stop halfway, then Dicht.</p>
<div class="bar"><button id="theme">Toggle light/dark</button><button id="wind">Wind 15 ↔ 42 km/h</button>
<select id="fab"><option value="blue">Blauw / wit</option><option value="red">Rood / wit</option><option value="green">Groen / wit</option><option value="grey">Grijs</option><option value="sand">Zand</option><option value="anthracite">Antraciet</option><option value="anthracite_white">Antraciet / wit</option><option value="orange">Oranje / wit</option><option value="yellow">Geel / wit</option></select></div>
<div class="grid" id="grid"></div>
<script>
const S=(state,attributes={})=>({state,attributes});
const states={
 "binary_sensor.zonnescherm_status":S("off",{device_class:"opening",friendly_name:"Zonnescherm status"}),
 "sensor.wind":S("15",{unit_of_measurement:"km/h"}),"sensor.buiten":S("23.4",{unit_of_measurement:"°C"}),
};
let hass, timer;
function push(){hass={language:"nl",locale:{language:"nl"},states:{...states},callService};document.querySelectorAll("awning-card").forEach(c=>c.hass=hass)}
function callService(d,s,data){
 const id=data.entity_id; clearTimeout(timer);
 if(id==="script.zonnescherm_open")timer=setTimeout(()=>{states["binary_sensor.zonnescherm_status"]=S("on",{device_class:"opening"});push()},800);
 if(id==="script.zonnescherm_dicht"){const c=document.querySelector("awning-card");const p=c._estimate().p;timer=setTimeout(()=>{states["binary_sensor.zonnescherm_status"]=S("off",{device_class:"opening"});push()},p*10000)}
 return Promise.resolve();
}
let cfg={name:"Zonnescherm",status_entity:"binary_sensor.zonnescherm_status",open:"script.zonnescherm_open",stop:"script.zonnescherm_stop",close:"script.zonnescherm_dicht",travel_time:10,wind:"sensor.wind",temperature:"sensor.buiten",wind_max:30,show_sensor:false};
const el=document.createElement("awning-card");el.setConfig(cfg);document.getElementById("grid").appendChild(el);
push();
document.getElementById("theme").onclick=()=>document.body.classList.toggle("light");
document.getElementById("wind").onclick=()=>{states["sensor.wind"]=S(states["sensor.wind"].state==="15"?"42":"15",{unit_of_measurement:"km/h"});push()};
document.getElementById("fab").onchange=(e)=>{cfg={...cfg,fabric:e.target.value};el.setConfig(cfg);el.hass=hass};
</script></body></html>
