name: Release

# Push a tag like v1.0.1 (or publish a release on GitHub) and this builds dist/ha-cards.js,
# creates the GitHub release if it doesn't exist yet, and attaches the bundle to it.
on:
  push:
    tags: ["v*"]
  release:
    types: [published]

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm run check && npm run build
      - name: Create release and attach ha-cards.js
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag
          gh release upload "$TAG" dist/ha-cards.js --clobber
